global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: omnex-engine

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: omnex-engine
    # `serve_metrics()` in obs/export.py, running on the host during
    # development. In Kubernetes this is replaced by pod discovery; the metric
    # names and the rules that read them do not change.
    static_configs:
      - targets: ["host.docker.internal:9464"]
    metric_relabel_configs:
      # Defence in depth against the failure the in-process cardinality cap
      # already guards: if a label ever leaks a raw id, drop the series here
      # rather than let it into storage where it is expensive to remove.
      - source_labels: [tenant]
        regex: "tnt_[0-9A-Z]{26}"
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["collector:8888"]
