# OTLP collector for traces exported by obs/export.py:OtlpTraceExporter.
#
# The engine does its own tail sampling before anything reaches here (see
# obs/trace.py for why head sampling throws away the traces you need). The
# collector's job is therefore transport and enrichment, not selection — a
# second sampling stage would discard traces the engine already decided were
# worth keeping.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Bound memory before the queue does. A collector OOM-killed mid-incident
  # takes the evidence with it.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  batch:
    timeout: 5s
    send_batch_size: 512

  attributes/redact:
    # Span attributes can carry prompt fragments. The guardrail layer (P6)
    # redacts on the way in, but telemetry is the classic second path by which
    # PII leaves a system, so redact here too.
    actions:
      - key: omnex.attr.prompt
        action: delete
      - key: omnex.attr.completion
        action: delete
      - key: omnex.attr.email
        action: delete

exporters:
  debug:
    verbosity: normal
  # Point this at a real backend (Tempo, Honeycomb, Grafana Cloud) in
  # production. Left as debug by default so a local `up` does not silently
  # ship traces to a third party.
  # otlphttp/tempo:
  #   endpoint: http://tempo:4318

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
