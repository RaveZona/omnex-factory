name: Release

# The only workflow here that produces something a stranger can install.
#
# Nothing on a normal push runs it. A tag is the deliberate act — and the tag is
# also a claim about *what* is being released, which `release_check.py --tag`
# checks against `pyproject.toml` rather than trusting. A release tagged
# `citegate-v0.2.0` against a 0.1.0 manifest ships an artifact that disagrees
# with its own name, and nothing else in the chain would notice.
#
# **This workflow has never run.** It is configuration until a tag exercises it,
# and `execution_state.json` records it as UNKNOWN rather than PASS for exactly
# that reason: a release path nobody has walked is a plan, not a path.
#
# `workflow_dispatch` exists so that the first execution does not have to be the
# real one. A tag is awkward to undo and a half-made public release is worse, so
# a dispatch runs gate → build → twine check → attest and stops: the two jobs
# that reach outside this repository are gated on `github.event_name == 'push'`.
# That is what makes the rehearsal safe *and* worth running — the one line here
# that could not be checked against GitHub's documentation from this environment
# (`actions/attest-build-provenance@v2`, see below) is exercised for real.

on:
  push:
    tags:
      - "citegate-v*"
  # Deliberately no `branches:` and no `pull_request:` — `covers_changes()` in
  # `release_check.py` keys on exactly those, and a dispatchable release gate
  # must still not count as continuous integration.
  workflow_dispatch:

# Read by default. Each job widens only what it needs, and the two that can reach
# outside this repository are the only ones granted any kind of write.
permissions:
  contents: read

concurrency:
  # Never cancel a release in flight. A cancelled publish is the one state that
  # cannot be reasoned about afterwards — some artifacts exist, some do not, and
  # nothing records which.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: The whole gate, on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `release_check.py` asks whether HEAD is on a remote branch. At depth
          # 1 it cannot know and answers UNKNOWN rather than refusing — correct,
          # but it makes the check decoration. Full history makes it real.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/pyproject.toml

      - name: Install
        working-directory: engine
        run: uv venv --python 3.12 && uv pip install -e '.[dev]'

      - name: The documented gate
        working-directory: engine
        # The same block CLAUDE.md documents. A release that skipped it would be
        # a weaker check than an ordinary push, which is backwards.
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run mypy
          uv run python scripts/invariant_map.py
          uv run python scripts/env_check.py
          uv run python scripts/extras_check.py
          uv run python scripts/state_map.py --check
          uv run python scripts/apply_decisions.py --dry-run
          uv run pytest tests/ -q

      - name: The suite of the thing actually being released
        working-directory: oss/citegate
        run: ../../engine/.venv/bin/python -m pytest tests/ -q

      - name: Release gate
        working-directory: engine
        # On a tag: `--tag`, not `--release` — the tag exists, it is why this is
        # running, so "is this name free" is always false and the real question
        # is whether it names the version being built.
        #
        # On a dispatch there is no tag to name, so the operator's mode runs
        # instead. The two ask different questions and neither substitutes for
        # the other: `--release` refuses a name already taken, `--tag` refuses a
        # name that disagrees with `pyproject.toml`.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            uv run python scripts/release_check.py --target citegate --tag "$TAG"
          else
            uv run python scripts/release_check.py --target citegate --release
          fi

  build:
    name: Build and attest
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the attestation is signed against this run's OIDC identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build sdist and wheel
        working-directory: oss/citegate
        run: uv build --out-dir dist

      - name: The artifacts must be readable as a package
        working-directory: oss/citegate
        # `uv build` succeeding says the backend ran. This says the metadata PyPI
        # will render is valid — a long description that fails to render is a
        # live listing nobody can read, discovered after publishing.
        run: uvx twine check --strict dist/*

      - name: Generate the SBOM, and read it back
        working-directory: oss/citegate
        # A CLEAN venv with only the package itself installed — never the venv
        # running cyclonedx-py. That was tried first, locally, before this step
        # existed: scanning cyclonedx-bom's own venv reported its ~30 transitive
        # dependencies (lxml, jsonschema, packageurl-python...) as if they were
        # citegate's own runtime dependencies, which would have described this
        # dependency-free package as depending on a JSON schema validator.
        # `uvx --from cyclonedx-bom` runs the tool from an isolated location and
        # points it at the CLEAN venv's interpreter instead, so only what is
        # actually installed there is described.
        #
        # The clean venv's own Python (3.11+, from `uv venv`'s default) runs
        # `sbom_check.py` too, right before it is deleted: that script has zero
        # third-party dependencies, so it needs nothing this job set up beyond
        # `uv`'s own managed interpreter, and generating a file nothing reads
        # back is the exact "a signed artifact is not automatic production
        # security" trap the operator's standard names directly.
        run: |
          uv venv .sbom-venv
          uv pip install --python .sbom-venv .
          uvx --from cyclonedx-bom cyclonedx-py environment \
            --pyproject pyproject.toml --of JSON -o dist/citegate.cdx.json \
            .sbom-venv/bin/python3
          .sbom-venv/bin/python3 ../../engine/scripts/sbom_check.py \
            dist/citegate.cdx.json pyproject.toml
          rm -rf .sbom-venv

      - name: Attest what built these
        # Signed provenance tying each artifact to this commit, this workflow and
        # this run, verifiable by anyone with `gh attestation verify`. That is
        # what §3.1 asked for: provenance somebody else can check, rather than a
        # file in which we describe ourselves. Runs after SBOM generation, so
        # `dist/*` also covers `citegate.cdx.json` — the SBOM itself is attested,
        # not just the wheel and sdist.
        #
        # `docs.github.com` is 403 at this environment's egress proxy, so this
        # pin could not be checked against GitHub's documentation — but the
        # action's own repository is public, and this session's git proxy serves
        # anonymous reads of public GitHub repos directly (the same lane
        # `add_repo` uses). That read found @v2 two majors stale: v2's last
        # release was v2.4.0 (2025-06-11), v4.0.0 shipped 2026-02-25 as a rewrite
        # wrapping `actions/attest`, and v4.2.2 (2026-08-06) still accepts
        # `subject-path` unchanged. @v2 still ran green (run 34237298583) — a
        # stale major is not a broken one — but "current" was never true, and
        # `C-008` was UNKNOWN, not SUPPORTED, for exactly that reason. Bumped
        # once the read confirmed nothing else here needs to change.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: oss/citegate/dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: citegate-dist
          path: oss/citegate/dist/*
          if-no-files-found: error

  github_release:
    name: GitHub release
    needs: build
    # A tag, never a manual dispatch. The rehearsal has to be unable to create
    # anything public, or it is not a rehearsal — it is the release with a
    # different trigger.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: citegate-dist
          path: dist

      - name: Publish the release
        # The artifacts travel in the release, so a user who does not want to
        # take a PyPI dependency can still get the exact files that were built
        # and check them against the attestation.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Built from ${GITHUB_SHA} by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}.

          Every artifact carries a signed build provenance attestation:

              gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"

  pypi:
    name: PyPI — needs the credential holder
    needs: [build, github_release]
    # Same rule as above. `needs: github_release` would already skip this on a
    # dispatch, so this line is redundant *today* — and stated for the case it
    # stops being: the `needs:` list is an ordering choice somebody may change,
    # while "this job may only run from a tag" is the property. The redundancy
    # is the cheaper half of that pair.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is the gate, and it is deliberately not something this
    # repository can grant itself: its required reviewer is a person and its
    # secret is the token that person holds. Same rule `packs/publish.py`
    # enforces for a storefront, and `apply_decisions.py` for a confirmation —
    # the system prepares, a person decides.
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: citegate-dist
          path: dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Refuse by name without the credential
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        # Tests emptiness only. The value is never echoed, never written to a
        # file and never passed as an argument: a preflight that prints a secret
        # to a build log has copied it, not checked it.
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::error::PYPI_API_TOKEN is not set on the 'pypi' environment."
            echo "Everything before this point succeeded: the gate is green, the"
            echo "artifacts are built and attested, and the GitHub release exists."
            echo "Add the secret to the environment and re-run this job."
            exit 1
          fi

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
